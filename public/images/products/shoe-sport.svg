<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
    <linearGradient id="sportUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252525"/><stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="motionGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="400" height="400" fill="#111"/>
  <circle cx="200" cy="210" r="140" fill="#D4AF37" opacity="0.03"/>

  <!-- Motion lines suggesting speed -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.15" stroke-linecap="round">
    <line x1="30" y1="180" x2="80" y2="180"/>
    <line x1="20" y1="200" x2="75" y2="200"/>
    <line x1="35" y1="220" x2="85" y2="220"/>
    <line x1="40" y1="240" x2="90" y2="240"/>
    <line x1="50" y1="160" x2="95" y2="160"/>
    <line x1="15" y1="260" x2="70" y2="260"/>
  </g>
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.1" stroke-linecap="round">
    <line x1="60" y1="170" x2="100" y2="170"/>
    <line x1="45" y1="230" x2="95" y2="230"/>
    <line x1="55" y1="250" x2="98" y2="250"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="210" cy="310" rx="130" ry="12" fill="#000" opacity="0.4"/>

  <!-- Shoe - dynamic angle (tilted forward) -->
  <g transform="translate(205,195) rotate(-8)">
    <!-- Outsole -->
    <path d="M-145,75 C-145,75 -130,90 -70,95 L10,97 C80,98 130,93 145,82 L145,70 C130,80 80,87 10,88 C-70,87 -130,80 -140,72 Z"
          fill="#1a1a1a" stroke="#D4AF37" stroke-width="1.2"/>

    <!-- Outsole tread pattern -->
    <g stroke="#D4AF37" stroke-width="0.6" opacity="0.3">
      <path d="M-130,88 L-125,93" /><path d="M-110,90 L-105,95"/>
      <path d="M-90,92 L-85,96"/><path d="M-70,93 L-65,97"/>
      <path d="M-50,94 L-45,97"/><path d="M-30,95 L-25,97"/>
      <path d="M-10,95 L-5,97"/><path d="M10,95 L15,97"/>
      <path d="M30,95 L35,97"/><path d="M50,94 L55,96"/>
      <path d="M70,92 L75,95"/><path d="M90,90 L95,93"/>
      <path d="M110,87 L115,90"/><path d="M130,84 L135,87"/>
    </g>

    <!-- Midsole - prominent gold -->
    <path d="M-140,70 C-130,78 -80,85 10,86 C90,85 135,78 145,70 L145,62 C135,70 90,78 10,79 C-70,79 -125,72 -138,65 Z"
          fill="#D4AF37" opacity="0.85"/>

    <!-- Upper - mesh texture -->
    <path d="M-135,65 C-135,30 -125,-15 -105,-50 C-85,-82 -60,-100 -30,-112
             C0,-118 30,-118 55,-108 C80,-98 100,-75 115,-45
             C125,-25 132,5 138,35 L145,62"
          fill="url(#sportUpper)" stroke="#D4AF37" stroke-width="1.2"/>

    <!-- Mesh texture pattern -->
    <g stroke="#D4AF37" stroke-width="0.3" opacity="0.15">
      <!-- Diagonal mesh lines -->
      <line x1="-120" y1="20" x2="-100" y2="-10"/><line x1="-100" y1="20" x2="-80" y2="-10"/>
      <line x1="-80" y1="20" x2="-60" y2="-10"/><line x1="-60" y1="20" x2="-40" y2="-10"/>
      <line x1="-40" y1="20" x2="-20" y2="-10"/><line x1="-20" y1="20" x2="0" y2="-10"/>
      <line x1="0" y1="20" x2="20" y2="-10"/><line x1="20" y1="20" x2="40" y2="-10"/>
      <line x1="40" y1="20" x2="60" y2="-10"/><line x1="60" y1="20" x2="80" y2="-10"/>
      <line x1="80" y1="20" x2="100" y2="-10"/>
      <!-- Reverse diagonal -->
      <line x1="-120" y1="-10" x2="-100" y2="20"/><line x1="-100" y1="-10" x2="-80" y2="20"/>
      <line x1="-80" y1="-10" x2="-60" y2="20"/><line x1="-60" y1="-10" x2="-40" y2="20"/>
      <line x1="-40" y1="-10" x2="-20" y2="20"/><line x1="-20" y1="-10" x2="0" y2="20"/>
      <line x1="0" y1="-10" x2="20" y2="20"/><line x1="20" y1="-10" x2="40" y2="20"/>
      <line x1="40" y1="-10" x2="60" y2="20"/><line x1="60" y1="-10" x2="80" y2="20"/>
      <line x1="80" y1="-10" x2="100" y2="20"/>
      <!-- Upper area mesh -->
      <line x1="-80" y1="-40" x2="-60" y2="-70"/><line x1="-60" y1="-40" x2="-40" y2="-70"/>
      <line x1="-40" y1="-40" x2="-20" y2="-70"/><line x1="-20" y1="-40" x2="0" y2="-70"/>
      <line x1="0" y1="-40" x2="20" y2="-70"/><line x1="20" y1="-40" x2="40" y2="-70"/>
      <line x1="40" y1="-40" x2="60" y2="-60"/>
      <line x1="-80" y1="-70" x2="-60" y2="-40"/><line x1="-60" y1="-70" x2="-40" y2="-40"/>
      <line x1="-40" y1="-70" x2="-20" y2="-40"/><line x1="-20" y1="-70" x2="0" y2="-40"/>
      <line x1="0" y1="-70" x2="20" y2="-40"/><line x1="20" y1="-70" x2="40" y2="-40"/>
      <line x1="40" y1="-60" x2="60" y2="-40"/>
    </g>

    <!-- Swoosh-like design element -->
    <path d="M-100,10 C-70,-20 -20,-45 40,-55 C70,-58 100,-50 120,-35"
          fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0.8"/>

    <!-- Collar -->
    <path d="M55,-108 C70,-98 85,-80 95,-60 C103,-43 108,-28 112,-15"
          fill="none" stroke="#D4AF37" stroke-width="1"/>

    <!-- Heel tab -->
    <path d="M115,-45 C122,-38 128,-25 132,-10 C135,5 137,20 138,35"
          fill="#D4AF37" opacity="0.15" stroke="#D4AF37" stroke-width="0.8"/>

    <!-- Eyelets -->
    <circle cx="-60" cy="-82" r="3" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="-35" cy="-92" r="3" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="-8" cy="-97" r="3" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="20" cy="-95" r="3" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="45" cy="-88" r="3" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>

    <!-- Laces -->
    <g stroke="#D4AF37" stroke-width="0.8" opacity="0.6">
      <line x1="-60" y1="-82" x2="-35" y2="-92"/>
      <line x1="-35" y1="-92" x2="-8" y2="-97"/>
      <line x1="-8" y1="-97" x2="20" y2="-95"/>
      <line x1="20" y1="-95" x2="45" y2="-88"/>
    </g>
  </g>

  <!-- Speed blur effects -->
  <g opacity="0.08" fill="#D4AF37">
    <ellipse cx="100" cy="200" rx="40" ry="3"/>
    <ellipse cx="80" cy="215" rx="30" ry="2"/>
    <ellipse cx="90" cy="185" rx="25" ry="2"/>
  </g>

  <!-- Corner elements -->
  <g stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.2">
    <path d="M20,20 L20,50 M20,20 L50,20"/>
    <path d="M380,20 L380,50 M380,20 L350,20"/>
    <path d="M20,380 L20,350 M20,380 L50,380"/>
    <path d="M380,380 L380,350 M380,380 L350,380"/>
  </g>
</svg>