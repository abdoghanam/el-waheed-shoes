<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="safetyUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2520"/><stop offset="100%" stop-color="#1a1815"/>
    </linearGradient>
    <linearGradient id="goldGradSa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#111"/>
  <circle cx="200" cy="210" r="140" fill="#D4AF37" opacity="0.03"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="315" rx="140" ry="14" fill="#000" opacity="0.45"/>

  <g transform="translate(200,200)">
    <!-- Heavy-duty sole -->
    <path d="M-148,80 C-148,80 -130,98 -70,103 L0,106 C70,107 130,100 148,88 L148,75 C130,85 70,94 0,95 C-70,94 -130,87 -145,78 Z"
          fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Sole deep tread -->
    <g stroke="#D4AF37" stroke-width="0.8" opacity="0.3">
      <path d="M-135,95 L-128,103"/><path d="M-115,98 L-108,105"/>
      <path d="M-95,100 L-88,107"/><path d="M-75,102 L-68,108"/>
      <path d="M-55,103 L-48,109"/><path d="M-35,104 L-28,109"/>
      <path d="M-15,105 L-8,110"/><path d="M5,105 L12,110"/>
      <path d="M25,105 L32,109"/><path d="M45,104 L52,108"/>
      <path d="M65,102 L72,106"/><path d="M85,100 L92,104"/>
      <path d="M105,96 L112,100"/><path d="M125,92 L132,96"/>
    </g>

    <!-- Reinforced midsole -->
    <path d="M-142,74 C-130,82 -70,90 0,91 C70,90 130,82 142,74 L142,66 C130,75 70,83 0,84 C-70,83 -130,76 -140,68 Z"
          fill="#D4AF37" opacity="0.7"/>

    <!-- Upper - heavy material -->
    <path d="M-140,68 C-140,30 -128,-15 -108,-50 C-88,-82 -62,-100 -32,-112
             C-2,-120 28,-120 55,-110 C82,-100 102,-78 115,-48
             C125,-22 132,12 138,42 L142,66"
          fill="url(#safetyUpper)" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Steel toe cap area -->
    <path d="M-140,68 C-138,50 -130,25 -118,5 C-106,-15 -90,-32 -72,-42"
          fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0.8"/>
    <!-- Steel cap label -->
    <text x="-95" y="-25" fill="#D4AF37" font-size="7" font-family="Arial" opacity="0.4" transform="rotate(-15,-95,-25)">STEEL</text>

    <!-- Ankle protection -->
    <path d="M100,-65 C115,-55 125,-35 130,-15 C134,5 137,30 140,55"
          fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
    <path d="M95,-60 C108,-52 118,-35 122,-15 C125,5 128,25 130,45"
          fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>

    <!-- Collar padding -->
    <path d="M55,-110 C70,-100 85,-82 95,-62 C103,-45 108,-30 112,-15"
          fill="none" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Tongue -->
    <path d="M-32,-112 C-22,-125 -2,-132 18,-130 C38,-128 48,-118 44,-105"
          fill="#1a1815" stroke="#D4AF37" stroke-width="1" opacity="0.8"/>

    <!-- Heavy-duty eyelets -->
    <circle cx="-65" cy="-90" r="4" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="-35" cy="-100" r="4" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="-5" cy="-105" r="4" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="25" cy="-103" r="4" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="52" cy="-95" r="4" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="75" cy="-80" r="4" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Thick laces -->
    <g stroke="#D4AF37" stroke-width="1.5" opacity="0.7">
      <line x1="-65" y1="-90" x2="-35" y2="-100"/>
      <line x1="-35" y1="-100" x2="-5" y2="-105"/>
      <line x1="-5" y1="-105" x2="25" y2="-103"/>
      <line x1="25" y1="-103" x2="52" y2="-95"/>
      <line x1="52" y1="-95" x2="75" y2="-80"/>
    </g>

    <!-- Reinforcement panels -->
    <path d="M-110,30 C-90,15 -50,5 0,2 C50,0 90,8 125,25"
          fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
    <path d="M-90,-20 C-70,-30 -30,-38 10,-38 C50,-37 80,-28 100,-15"
          fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>

    <!-- Heavy stitching -->
    <g stroke="#F0D68A" stroke-width="0.6" opacity="0.3" fill="none" stroke-dasharray="4,3">
      <path d="M-130,62 C-90,50 -30,42 20,40 C70,39 110,44 135,56"/>
    </g>
  </g>

  <!-- Safety badge -->
  <g transform="translate(310,80)">
    <circle cx="0" cy="0" r="22" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="Arial" font-weight="bold">SAFETY</text>
    <text x="0" y="8" text-anchor="middle" fill="#D4AF37" font-size="7" font-family="Arial">CERTIFIED</text>
    <!-- Shield icon -->
    <path d="M0,-18 L-8,-14 L-8,-4 C-8,2 -3,6 0,8 C3,6 8,2 8,-4 L8,-14 Z" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Corner elements -->
  <g stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.2">
    <path d="M20,20 L20,50 M20,20 L50,20"/>
    <path d="M380,20 L380,50 M380,20 L350,20"/>
    <path d="M20,380 L20,350 M20,380 L50,380"/>
    <path d="M380,380 L380,350 M380,380 L350,380"/>
  </g>
</svg>