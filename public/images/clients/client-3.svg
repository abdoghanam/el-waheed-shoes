    <rect x="-18" y="-18" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" transform="rotate(45)"/>
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.25" transform="rotate(45)"/>
  </g>
  <text x="108" y="35" fill="#ffffff" font-size="20" font-family="Arial, sans-serif" font-weight="300" opacity="0.7">CW</text>
  <text x="108" y="52" fill="#ffffff" font-size="7" font-family="Arial, sans-serif" font-weight="300" letter-spacing="3" opacity="0.4">GLOBAL</text>
</svg>