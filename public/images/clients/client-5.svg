<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <rect width="200" height="80" fill="transparent"/>
  <!-- Overlapping circles logo -->
  <g transform="translate(50,40)">
    <circle cx="-8" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <circle cx="8" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <!-- Intersection highlight -->
    <path d="M0,-10 C4,-6 4,6 0,10 C-4,6 -4,-6 0,-10" fill="#ffffff" opacity="0.1"/>
  </g>
  <text x="108" y="35" fill="#ffffff" font-size="20" font-family="Georgia, serif" font-style="italic" opacity="0.7">EF</text>
  <text x="108" y="52" fill="#ffffff" font-size="7" font-family="Georgia, serif" letter-spacing="3" opacity="0.4">MARKET</text>
