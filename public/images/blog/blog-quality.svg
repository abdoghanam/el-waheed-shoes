<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="darkOverlayQ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111" stop-opacity="0.6"/><stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#0a0a0a"/>

  <!-- Quality inspection scene -->
  <g>
    <!-- Workbench -->
    <rect x="50" y="220" width="500" height="15" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8"/>
    <line x1="80" y1="235" x2="80" y2="300" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
    <line x1="520" y1="235" x2="520" y2="300" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>

    <!-- Shoe being inspected -->
    <g transform="translate(200,180)">
      <path d="M0,40 C0,25 10,5 25,-10 C40,-22 55,-28 70,-28 C85,-28 100,-22 112,-10 C120,0 125,15 128,35 L128,38"
            fill="#1a1510" stroke="#D4AF37" stroke-width="1.2"/>
      <path d="M-2,38 C-2,38 2,42 25,45 L125,42 C128,40 128,38 128,38"
            fill="#D4AF37" opacity="0.15"/>
    </g>

    <!-- Magnifying glass -->
    <g transform="translate(280,160)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <circle cx="0" cy="0" r="32" fill="#1a1a1a" opacity="0.2"/>
      <line x1="24" y1="24" x2="55" y2="55" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
      <!-- Lens glare -->
      <path d="M-15,-18 C-10,-25 0,-28 10,-24" fill="none" stroke="#F0D68A" stroke-width="1" opacity="0.3"/>
    </g>

    <!-- Inspector silhouette -->
    <g transform="translate(380,60)">
      <ellipse cx="0" cy="0" rx="18" ry="22" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8"/>
      <path d="M-20,22 C-15,16 -8,14 0,14 C8,14 15,16 20,22 L22,80 L-22,80 Z" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8"/>
      <line x1="-22" y1="35" x2="-45" y2="55" stroke="#D4AF37" stroke-width="1.5"/>
      <line x1="22" y1="35" x2="45" y2="55" stroke="#D4AF37" stroke-width="1.5"/>
    </g>

    <!-- Checklist board -->
    <g transform="translate(420,100)">
      <rect x="0" y="0" width="80" height="100" fill="#111" stroke="#D4AF37" stroke-width="1"/>
      <g stroke="#D4AF37" stroke-width="0.8" opacity="0.5">
        <rect x="8" y="12" width="8" height="8" fill="none"/><path d="M10,16 L13,19 L16,13" fill="none"/>
        <line x1="22" y1="16" x2="65" y2="16"/>
        <rect x="8" y="28" width="8" height="8" fill="none"/><path d="M10,32 L13,35 L16,29" fill="none"/>
        <line x1="22" y1="32" x2="65" y2="32"/>
        <rect x="8" y="44" width="8" height="8" fill="none"/><path d="M10,48 L13,51 L16,45" fill="none"/>
        <line x1="22" y1="48" x2="65" y2="48"/>
        <rect x="8" y="60" width="8" height="8" fill="none"/>
        <line x1="22" y1="64" x2="65" y2="64"/>
        <rect x="8" y="76" width="8" height="8" fill="none"/>
        <line x1="22" y1="80" x2="50" y2="80"/>
      </g>
    </g>

    <!-- Quality seal -->
    <g transform="translate(100,120)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="25" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>
      <path d="M-10,0 L-4,6 L12,-6" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="-12" text-anchor="middle" fill="#D4AF37" font-size="6" font-family="Arial" letter-spacing="1" opacity="0.5">QUALITY</text>
      <text x="0" y="18" text-anchor="middle" fill="#D4AF37" font-size="6" font-family="Arial" letter-spacing="1" opacity="0.5">PASS</text>
    </g>
  </g>

  <!-- Dark overlay -->
  <rect width="600" height="400" fill="url(#darkOverlayQ)"/>

  <!-- Title -->
  <rect x="0" y="320" width="600" height="80" fill="#0a0a0a" opacity="0.8"/>
  <line x1="40" y1="330" x2="100" y2="330" stroke="#D4AF37" stroke-width="2"/>
  <text x="40" y="360" fill="#ffffff" font-size="18" font-family="Georgia, serif" opacity="0.9">Quality Inspection Process</text>
  <text x="40" y="380" fill="#D4AF37" font-size="10" font-family="Arial" letter-spacing="1" opacity="0.6">EVERY PAIR MATTERS</text>
</svg>