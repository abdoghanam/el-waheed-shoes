<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="greenGoldBlog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d6b4a"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
    <linearGradient id="darkOverlayS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111" stop-opacity="0.6"/><stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#0a0a0a"/>

  <!-- Large leaf -->
  <g transform="translate(300,180)" opacity="0.25">
    <path d="M0,-120 C50,-100 80,-60 80,10 C80,80 50,120 0,130 C-50,120 -80,80 -80,10 C-80,-60 -50,-100 0,-120 Z"
          fill="url(#greenGoldBlog)" stroke="#D4AF37" stroke-width="1"/>
    <!-- Leaf veins -->
    <path d="M0,-110 L0,120" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <path d="M0,-60 C-30,-40 -55,-10 -65,20" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.3"/>
    <path d="M0,-60 C30,-40 55,-10 65,20" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.3"/>
    <path d="M0,0 C-25,15 -50,35 -58,55" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.3"/>
    <path d="M0,0 C25,15 50,35 58,55" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Recycle symbol -->
  <g transform="translate(150,150)" opacity="0.2">
    <path d="M0,-40 L15,-15 L-15,-15 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M-30,20 L-15,-5 L-45,-5 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M30,20 L45,-5 L15,-5 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <!-- Arrows -->
    <polygon points="0,-42 -5,-35 5,-35" fill="#D4AF37"/>
    <polygon points="-32,22 -38,15 -26,15" fill="#D4AF37"/>
    <polygon points="32,22 26,15 38,15" fill="#D4AF37"/>
  </g>

  <!-- Shoe with leaf -->
  <g transform="translate(380,200)" opacity="0.3">
    <path d="M0,20 C0,10 8,0 20,-8 C32,-14 45,-12 55,-5 C62,0 65,10 68,20 L68,25"
          fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <path d="M-2,22 L68,22 L70,25 L-2,25 Z" fill="#D4AF37" opacity="0.2"/>
    <!-- Small leaf on shoe -->
    <path d="M55,-8 C60,-15 65,-12 62,-5 C60,0 55,2 52,0 C50,-3 52,-6 55,-8 Z"
          fill="#4a7c59" opacity="0.3" stroke="#D4AF37" stroke-width="0.5"/>
  </g>

  <!-- Sustainability icons -->
  <g transform="translate(80,280)" opacity="0.2">
    <!-- Water drop -->
    <path d="M0,-15 C-5,-8 -8,0 -8,5 C-8,10 -4,14 0,14 C4,14 8,10 8,5 C8,0 5,-8 0,-15 Z"
          fill="none" stroke="#D4AF37" stroke-width="1"/>
    <!-- Sun -->
    <circle cx="80" cy="0" r="8" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <g stroke="#D4AF37" stroke-width="0.5">
      <line x1="80" y1="-12" x2="80" y2="-16"/><line x1="80" y1="12" x2="80" y2="16"/>
      <line x1="-12" y1="0" x2="-16" y2="0" transform="translate(80,0)"/>
      <line x1="12" y1="0" x2="16" y2="0" transform="translate(80,0)"/>
    </g>
    <!-- Wind -->
    <path d="M150,-8 C155,-8 160,-5 160,0 C160,5 155,8 150,8" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <path d="M145,0 L165,0" stroke="#D4AF37" stroke-width="0.5"/>
  </g>

  <!-- Green circle pattern -->
  <g stroke="#4a7c59" stroke-width="0.5" opacity="0.08">
    <circle cx="450" cy="100" r="40"/><circle cx="450" cy="100" r="50"/>
    <circle cx="450" cy="100" r="60"/>
  </g>

  <!-- Dark overlay -->
  <rect width="600" height="400" fill="url(#darkOverlayS)"/>

  <!-- Title -->
  <rect x="0" y="320" width="600" height="80" fill="#0a0a0a" opacity="0.8"/>
  <line x1="40" y1="330" x2="100" y2="330" stroke="#D4AF37" stroke-width="2"/>
  <text x="40" y="360" fill="#ffffff" font-size="18" font-family="Georgia, serif" opacity="0.9">Sustainable Manufacturing</text>
  <text x="40" y="380" fill="#D4AF37" font-size="10" font-family="Arial" letter-spacing="1" opacity="0.6">GREEN PRODUCTION METHODS</text>
</svg>