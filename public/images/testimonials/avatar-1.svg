<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradAv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <!-- Circle frame -->
  <circle cx="50" cy="50" r="46" fill="#111" stroke="url(#goldGradAv)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="#1a1a1a"/>

  <!-- Abstract person silhouette - short hair, upright -->
  <g transform="translate(50,48)">
    <!-- Head -->
    <ellipse cx="0" cy="-12" rx="12" ry="14" fill="#2a2a2a" stroke="#D4AF37" stroke-width="0.8"/>
    <!-- Hair - short -->
    <path d="M-10,-22 C-10,-28 -5,-30 0,-30 C5,-30 10,-28 10,-22" fill="#2a2a2a" stroke="#D4AF37" stroke-width="0.6" opacity="0.5"/>
    <!-- Shoulders -->
    <path d="M-20,8 C-15,2 -8,0 0,0 C8,0 15,2 20,8 L20,25 L-20,25 Z" fill="#2a2a2a" stroke="#D4AF37" stroke-width="0.8"/>
    <!-- Collar detail -->
    <path d="M-6,2 L0,6 L6,2" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>