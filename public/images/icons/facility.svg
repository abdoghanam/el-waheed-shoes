<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGradFc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" fill="#111"/>

  <!-- Factory building -->
  <rect x="20" y="40" width="80" height="45" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.2"/>

  <!-- Roof -->
  <polygon points="15,40 60,20 105,40" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>

  <!-- Smokestacks -->
  <rect x="30" y="22" width="8" height="18" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8"/>
  <rect x="45" y="15" width="10" height="25" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8"/>

  <!-- Windows -->
  <rect x="28" y="50" width="15" height="12" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.6"/>
  <rect x="52" y="50" width="15" height="12" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.6"/>
  <rect x="77" y="50" width="15" height="12" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.6"/>

  <!-- Door -->
  <rect x="50" y="68" width="20" height="17" fill="#0a0a0a" stroke="#D4AF37" stroke-width="0.8"/>

  <!-- Blueprint dimension lines -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.4">
    <!-- Width dimension -->
    <line x1="15" y1="92" x2="105" y2="92"/>
    <line x1="15" y1="89" x2="15" y2="95"/>
    <line x1="105" y1="89" x2="105" y2="95"/>
    <!-- Height dimension -->
    <line x1="110" y1="20" x2="110" y2="85"/>
    <line x1="107" y1="20" x2="113" y2="20"/>
    <line x1="107" y1="85" x2="113" y2="85"/>
  </g>

  <!-- Grid lines (blueprint feel) -->
  <g stroke="#D4AF37" stroke-width="0.2" opacity="0.08">
    <line x1="0" y1="10" x2="120" y2="10"/><line x1="0" y1="30" x2="120" y2="30"/>
    <line x1="0" y1="50" x2="120" y2="50"/><line x1="0" y1="70" x2="120" y2="70"/>
    <line x1="0" y1="90" x2="120" y2="90"/><line x1="0" y1="110" x2="120" y2="110"/>
    <line x1="10" y1="0" x2="10" y2="120"/><line x1="30" y1="0" x2="30" y2="120"/>
    <line x1="50" y1="0" x2="50" y2="120"/><line x1="70" y1="0" x2="70" y2="120"/>
    <line x1="90" y1="0" x2="90" y2="120"/><line x1="110" y1="0" x2="110" y2="120"/>
  </g>

  <!-- "4000m²" text -->
  <text x="60" y="108" text-anchor="middle" fill="#D4AF37" font-size="13" font-family="Georgia, serif" font-weight="bold">4000m²</text>
</svg>