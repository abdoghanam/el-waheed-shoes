<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" fill="#111"/>

  <!-- Shield/badge shape -->
  <path d="M60,10 L95,25 L95,55 C95,75 78,95 60,105 C42,95 25,75 25,55 L25,25 Z"
        fill="#0d0d0d" stroke="url(#goldGradE)" stroke-width="2"/>

  <!-- Inner shield -->
  <path d="M60,18 L88,30 L88,54 C88,72 74,88 60,97 C46,88 32,72 32,54 L32,30 Z"
        fill="#111" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>

  <!-- Laurel wreath left -->
  <g fill="#D4AF37" opacity="0.5">
    <ellipse cx="35" cy="55" rx="3" ry="6" transform="rotate(-20,35,55)"/>
    <ellipse cx="33" cy="45" rx="3" ry="6" transform="rotate(-10,33,45)"/>
    <ellipse cx="33" cy="35" rx="3" ry="6" transform="rotate(0,33,35)"/>
    <ellipse cx="36" cy="65" rx="3" ry="6" transform="rotate(-30,36,65)"/>
    <ellipse cx="40" cy="74" rx="3" ry="5" transform="rotate(-40,40,74)"/>
  </g>
  <!-- Laurel wreath right -->
  <g fill="#D4AF37" opacity="0.5">
    <ellipse cx="85" cy="55" rx="3" ry="6" transform="rotate(20,85,55)"/>
    <ellipse cx="87" cy="45" rx="3" ry="6" transform="rotate(10,87,45)"/>
    <ellipse cx="87" cy="35" rx="3" ry="6" transform="rotate(0,87,35)"/>
    <ellipse cx="84" cy="65" rx="3" ry="6" transform="rotate(30,84,65)"/>
    <ellipse cx="80" cy="74" rx="3" ry="5" transform="rotate(40,80,74)"/>
  </g>

  <!-- "15+" text -->
  <text x="60" y="58" text-anchor="middle" fill="#D4AF37" font-size="28" font-family="Georgia, serif" font-weight="bold">15+</text>
  <text x="60" y="75" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="Arial" letter-spacing="2" opacity="0.7">YEARS</text>

  <!-- Decorative stars -->
  <g fill="#D4AF37" opacity="0.6">
    <polygon points="60,15 61.5,19 66,19 62.5,22 64,26 60,23.5 56,26 57.5,22 54,19 58.5,19"/>
  </g>
</svg>