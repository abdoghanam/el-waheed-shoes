<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="greenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7c59"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d6b4a"/><stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" fill="#111"/>

  <!-- Circle background -->
  <circle cx="60" cy="52" r="40" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Leaf shape -->
  <g transform="translate(60,48)">
    <!-- Main leaf -->
    <path d="M0,-25 C15,-20 25,-10 25,5 C25,20 15,30 0,32 C-15,30 -25,20 -25,5 C-25,-10 -15,-20 0,-25 Z"
          fill="url(#leafGrad)" opacity="0.3" stroke="#D4AF37" stroke-width="1.2"/>

    <!-- Leaf vein -->
    <path d="M0,-22 L0,28" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <path d="M0,-10 C-8,-5 -15,0 -18,8" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>
    <path d="M0,-10 C8,-5 15,0 18,8" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>
    <path d="M0,5 C-6,8 -12,12 -14,18" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>
    <path d="M0,5 C6,8 12,12 14,18" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>

    <!-- Small shoe silhouette inside leaf -->
    <path d="M-10,5 C-10,0 -5,-3 0,-4 C5,-3 10,0 10,5 L10,8 C5,7 0,6 -5,6 C-8,6 -10,7 -10,8 Z"
          fill="#D4AF37" opacity="0.5" stroke="#D4AF37" stroke-width="0.5"/>
  </g>

  <!-- Recycling arrows suggestion -->
  <g stroke="#D4AF37" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M30,80 C30,72 35,68 42,68"/>
    <path d="M90,80 C90,72 85,68 78,68"/>
    <polygon points="42,65 42,71 38,68" fill="#D4AF37" opacity="0.3"/>
    <polygon points="78,65 78,71 82,68" fill="#D4AF37" opacity="0.3"/>
  </g>

  <!-- "ECO" text -->
  <text x="60" y="102" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="Arial" font-weight="bold" letter-spacing="2" opacity="0.7">ECO FRIENDLY</text>
</svg>