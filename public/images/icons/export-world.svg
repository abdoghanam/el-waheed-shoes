<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" fill="#111"/>

  <!-- Globe -->
  <circle cx="60" cy="52" r="38" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Globe grid lines -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.2" fill="none">
    <!-- Latitude lines -->
    <ellipse cx="60" cy="35" rx="32" ry="8"/>
    <ellipse cx="60" cy="52" rx="36" ry="10"/>
    <ellipse cx="60" cy="69" rx="32" ry="8"/>
    <!-- Longitude lines -->
    <ellipse cx="60" cy="52" rx="10" ry="36"/>
    <ellipse cx="60" cy="52" rx="25" ry="36"/>
  </g>

  <!-- Simplified continent shapes -->
  <g fill="#D4AF37" opacity="0.15">
    <!-- Africa (highlighted - Egypt) -->
    <path d="M55,35 C58,33 62,33 65,35 C68,38 70,45 68,52 C66,58 62,62 58,60 C54,58 52,50 53,42 C54,38 54,36 55,35"/>
    <!-- Europe -->
    <path d="M45,30 C48,28 55,27 58,30 C60,33 58,37 55,38 C50,38 46,35 45,30"/>
    <!-- Asia -->
    <path d="M65,28 C70,25 80,26 85,30 C88,35 85,42 80,45 C75,47 68,44 65,40 C63,36 63,32 65,28"/>
    <!-- South America -->
    <path d="M35,52 C37,50 40,52 42,56 C43,60 42,68 38,72 C35,74 33,70 32,65 C31,60 33,55 35,52"/>
    <!-- North America -->
    <path d="M20,30 C25,25 35,24 38,28 C40,32 38,38 34,40 C30,42 24,40 22,36 C20,34 19,32 20,30"/>
  </g>

  <!-- Egypt highlighted with gold dot -->
  <circle cx="58" cy="40" r="3" fill="#D4AF37" opacity="0.8"/>
  <circle cx="58" cy="40" r="5" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- Trade routes from Egypt -->
  <g stroke="#D4AF37" stroke-width="0.8" opacity="0.4" fill="none" stroke-dasharray="3,2">
    <path d="M58,40 C55,35 50,32 45,30"/>
    <path d="M58,40 C62,38 70,35 78,32"/>
    <path d="M58,40 C52,45 40,48 35,52"/>
    <path d="M58,40 C65,45 72,50 80,48"/>
    <path d="M58,40 C55,48 50,55 48,60"/>
  </g>

  <!-- Destination dots -->
  <g fill="#D4AF37" opacity="0.5">
    <circle cx="45" cy="30" r="2"/>
    <circle cx="78" cy="32" r="2"/>
    <circle cx="35" cy="52" r="2"/>
    <circle cx="80" cy="48" r="2"/>
    <circle cx="28" cy="35" r="1.5"/>
    <circle cx="85" cy="38" r="1.5"/>
  </g>

  <!-- Globe shine -->
  <path d="M35,30 C40,22 50,18 58,20" fill="none" stroke="#F0D68A" stroke-width="0.8" opacity="0.2"/>

  <!-- "EXPORT" text -->
  <text x="60" y="100" text-anchor="middle" fill="#D4AF37" font-size="8" font-family="Arial" letter-spacing="2" opacity="0.7">GLOBAL EXPORT</text>

  <!-- Small airplane -->
  <g transform="translate(85,25) rotate(30)" opacity="0.4">
    <path d="M0,0 L8,-2 L6,0 L8,2 L0,0" fill="#D4AF37"/>
    <line x1="3" y1="-2" x2="5" y2="-5" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="3" y1="2" x2="5" y2="5" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
</svg>