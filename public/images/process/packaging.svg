<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#111"/>

  <!-- Shoe box - 3D perspective -->
  <g>
    <!-- Box bottom -->
    <path d="M30,100 L90,130 L170,100 L110,70 Z" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
    <!-- Box front -->
    <path d="M30,100 L30,145 L110,175 L110,130 Z" fill="#151515" stroke="#D4AF37" stroke-width="1"/>
    <!-- Box side -->
    <path d="M110,130 L110,175 L170,145 L170,100 Z" fill="#121212" stroke="#D4AF37" stroke-width="1"/>

    <!-- Box lid (being closed) -->
    <path d="M35,95 L90,122 L168,95 L115,68 Z" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8" opacity="0.8"/>
    <!-- Lid edge -->
    <path d="M35,95 L35,100 L90,130 L90,122 Z" fill="#181818" stroke="#D4AF37" stroke-width="0.5"/>
    <path d="M168,95 L168,100 L90,130 L90,122 Z" fill="#161616" stroke="#D4AF37" stroke-width="0.5"/>

    <!-- Brand label on box -->
    <rect x="55" y="108" width="35" height="18" fill="#D4AF37" opacity="0.15" stroke="#D4AF37" stroke-width="0.5" rx="1" transform="skewX(-10)"/>
    <text x="72" y="120" text-anchor="middle" fill="#D4AF37" font-size="5" font-family="Arial" font-weight="bold" opacity="0.6" transform="skewX(-10)">EL WAHEED</text>

    <!-- Gold stripe on box -->
    <path d="M30,120 L30,122 L110,152 L110,150 Z" fill="#D4AF37" opacity="0.3"/>
    <path d="M110,150 L110,152 L170,122 L170,120 Z" fill="#D4AF37" opacity="0.2"/>
  </g>

  <!-- Tissue paper coming out -->
  <g opacity="0.4">
    <path d="M50,88 C55,80 65,75 75,78 C85,82 80,90 70,92 C60,94 50,92 48,88"
          fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <path d="M95,105 C100,98 110,95 118,98 C125,102 120,108 112,110 C104,112 95,110 93,105"
          fill="none" stroke="#D4AF37" stroke-width="0.8"/>
  </g>

  <!-- Shoe inside box (partially visible) -->
  <g transform="translate(60,75)" opacity="0.4">
    <path d="M0,15 C0,8 5,2 15,-2 C25,-5 35,-3 40,2 L40,13"
          fill="#1a1510" stroke="#D4AF37" stroke-width="0.6"/>
    <path d="M-2,14 C-2,14 2,18 15,20 L38,18 C40,16 40,14 40,13"
          fill="#D4AF37" opacity="0.15"/>
  </g>

  <!-- Shipping label -->
  <g transform="translate(135,118)">
    <rect x="0" y="0" width="28" height="20" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.6" rx="1" transform="skewY(-8)"/>
    <g stroke="#D4AF37" stroke-width="0.3" opacity="0.4" transform="skewY(-8)">
      <line x1="3" y1="4" x2="25" y2="4"/><line x1="3" y1="8" x2="25" y2="8"/>
      <line x1="3" y1="12" x2="25" y2="12"/><line x1="3" y1="16" x2="18" y2="16"/>
    </g>
    <!-- Barcode suggestion -->
    <g transform="translate(5,14) skewY(-8)" opacity="0.3">
      <rect x="0" y="0" width="1" height="6" fill="#D4AF37"/><rect x="2" y="0" width="2" height="6" fill="#D4AF37"/>
      <rect x="5" y="0" width="1" height="6" fill="#D4AF37"/><rect x="7" y="0" width="1" height="6" fill="#D4AF37"/>
      <rect x="9" y="0" width="2" height="6" fill="#D4AF37"/><rect x="12" y="0" width="1" height="6" fill="#D4AF37"/>
      <rect x="14" y="0" width="2" height="6" fill="#D4AF37"/><rect x="17" y="0" width="1" height="6" fill="#D4AF37"/>
      <rect x="19" y="0" width="1" height="6" fill="#D4AF37"/><rect x="21" y="0" width="2" height="6" fill="#D4AF37"/>
    </g>
  </g>

  <!-- Stacking arrows -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.3" fill="none">
    <path d="M160,75 L160,60 L155,65 M160,60 L165,65"/>
  </g>

  <!-- Ribbon/bow -->
  <g transform="translate(90,85)" opacity="0.5">
    <path d="M0,0 C-8,-8 -15,-5 -12,0 C-15,5 -8,8 0,0" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <path d="M0,0 C8,-8 15,-5 12,0 C15,5 8,8 0,0" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#D4AF37"/>
  </g>
</svg>