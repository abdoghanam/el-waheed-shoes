<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradSt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#111"/>

  <!-- Leather piece being sewn -->
  <path d="M25,70 C25,65 30,60 40,58 L160,58 C170,58 175,63 175,70 L175,140 C175,145 170,150 160,150 L40,150 C30,150 25,145 25,140 Z"
        fill="#1a1510" stroke="#D4AF37" stroke-width="0.8"/>

  <!-- Leather texture -->
  <g stroke="#D4AF37" stroke-width="0.2" opacity="0.06">
    <line x1="30" y1="70" x2="170" y2="70"/><line x1="30" y1="85" x2="170" y2="85"/>
    <line x1="30" y1="100" x2="170" y2="100"/><line x1="30" y1="115" x2="170" y2="115"/>
    <line x1="30" y1="130" x2="170" y2="130"/><line x1="30" y1="145" x2="170" y2="145"/>
  </g>

  <!-- Stitching line - gold thread -->
  <g stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-dasharray="8,4" opacity="0.9">
    <path d="M40,85 L160,85"/>
    <path d="M40,100 L100,100"/>
  </g>

  <!-- Completed stitches -->
  <g stroke="#F0D68A" stroke-width="1" opacity="0.8">
    <line x1="40" y1="83" x2="40" y2="87"/><line x1="48" y1="83" x2="48" y2="87"/>
    <line x1="56" y1="83" x2="56" y2="87"/><line x1="64" y1="83" x2="64" y2="87"/>
    <line x1="72" y1="83" x2="72" y2="87"/><line x1="80" y1="83" x2="80" y2="87"/>
    <line x1="88" y1="83" x2="88" y2="87"/><line x1="96" y1="83" x2="96" y2="87"/>
  </g>

  <!-- Sewing needle -->
  <g transform="translate(105,95) rotate(15)">
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="-2,-55 2,-55 0,-65" fill="#D4AF37"/>
    <!-- Needle eye -->
    <ellipse cx="0" cy="-50" rx="1.5" ry="3" fill="#111" stroke="#D4AF37" stroke-width="0.5"/>
  </g>

  <!-- Thread from needle -->
  <path d="M105,95 C115,110 130,115 145,110 C155,107 160,100 160,95 C160,88 155,85 148,85"
        fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.7"/>
  <!-- Thread going up -->
  <path d="M108,90 C115,70 130,60 150,55 L175,50"
        fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- Thread spool -->
  <g transform="translate(160,42)">
    <rect x="-10" y="-8" width="20" height="16" fill="#D4AF37" opacity="0.4" stroke="#D4AF37" stroke-width="0.8" rx="2"/>
    <rect x="-8" y="-6" width="16" height="12" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.5" rx="1"/>
    <line x1="-6" y1="-3" x2="6" y2="-3" stroke="#D4AF37" stroke-width="0.3" opacity="0.4"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#D4AF37" stroke-width="0.3" opacity="0.4"/>
    <line x1="-6" y1="3" x2="6" y2="3" stroke="#D4AF37" stroke-width="0.3" opacity="0.4"/>
  </g>

  <!-- Stitching pattern detail -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.3" fill="none">
    <path d="M35,120 L45,115 L55,120 L65,115 L75,120 L85,115 L95,120 L105,115"/>
    <path d="M35,135 L45,130 L55,135 L65,130 L75,135 L85,130 L95,135 L105,130"/>
  </g>

  <!-- Thimble -->
  <g transform="translate(30,50)">
    <path d="M0,0 C-6,-3 -8,-10 -6,-18 C-4,-24 0,-28 5,-28 C10,-28 14,-24 16,-18 C18,-10 16,-3 10,0 Z"
          fill="#1a1a1a" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <g fill="#D4AF37" opacity="0.3">
      <circle cx="2" cy="-20" r="1"/><circle cx="6" cy="-22" r="1"/>
      <circle cx="10" cy="-20" r="1"/><circle cx="4" cy="-16" r="1"/>
      <circle cx="8" cy="-16" r="1"/>
    </g>
  </g>
</svg>