<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#111"/>

  <!-- Workbench -->
  <rect x="15" y="130" width="170" height="12" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8"/>
  <line x1="30" y1="142" x2="30" y2="175" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="142" x2="170" y2="175" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

  <!-- Shoe upper being held -->
  <g transform="translate(60,70)">
    <path d="M0,60 C0,35 10,10 25,-10 C40,-28 55,-35 70,-35 C85,-35 100,-28 110,-15 C118,-5 122,10 125,30 L125,58"
          fill="#1a1510" stroke="#D4AF37" stroke-width="1.2"/>
    <!-- Eyelets -->
    <circle cx="30" cy="-15" r="2.5" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="45" cy="-22" r="2.5" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="60" cy="-25" r="2.5" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="75" cy="-22" r="2.5" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8"/>
  </g>

  <!-- Sole being attached -->
  <g transform="translate(45,125)">
    <path d="M5,0 C5,0 10,8 30,12 L90,14 C110,13 120,8 122,2 L122,-5 C110,0 90,5 60,6 C30,5 10,0 5,-3 Z"
          fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>
    <!-- Glue/adhesive indication -->
    <path d="M15,2 L100,4" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
  </g>

  <!-- Arrow showing sole attachment direction -->
  <path d="M105,145 L105,110" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="100,112 110,112 105,105" fill="#D4AF37" opacity="0.6"/>

  <!-- Gears/mechanical elements - precision -->
  <g transform="translate(165,55)">
    <!-- Gear 1 -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8"/>
    <g stroke="#D4AF37" stroke-width="1.2" opacity="0.4">
      <line x1="0" y1="-15" x2="0" y2="-20"/><line x1="15" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="15" x2="0" y2="20"/><line x1="-15" y1="0" x2="-20" y2="0"/>
      <line x1="10" y1="-10" x2="14" y2="-14"/><line x1="10" y1="10" x2="14" y2="14"/>
      <line x1="-10" y1="-10" x2="-14" y2="-14"/><line x1="-10" y1="10" x2="-14" y2="14"/>
    </g>

    <!-- Gear 2 (smaller) -->
    <circle cx="18" cy="18" r="10" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
    <circle cx="18" cy="18" r="3" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.6"/>
    <g stroke="#D4AF37" stroke-width="0.8" opacity="0.3">
      <line x1="18" y1="8" x2="18" y2="5"/><line x1="28" y1="18" x2="31" y2="18"/>
      <line x1="18" y1="28" x2="18" y2="31"/><line x1="8" y1="18" x2="5" y2="18"/>
      <line x1="25" y1="11" x2="27" y2="9"/><line x1="25" y1="25" x2="27" y2="27"/>
    </g>
  </g>

  <!-- Hands/tools indicators -->
  <g transform="translate(35,80)" opacity="0.5">
    <!-- Press tool -->
    <rect x="0" y="0" width="8" height="25" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8" rx="1"/>
    <rect x="-2" y="25" width="12" height="5" fill="#D4AF37" opacity="0.4" rx="1"/>
  </g>

  <!-- Adhesive bottle -->
  <g transform="translate(140,115)">
    <rect x="0" y="0" width="12" height="18" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8" rx="2"/>
    <rect x="3" y="-5" width="6" height="5" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.5"/>
    <text x="6" y="12" text-anchor="middle" fill="#D4AF37" font-size="5" font-family="Arial" opacity="0.5">GL</text>
  </g>

  <!-- Precision alignment marks -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.3">
    <line x1="60" y1="120" x2="60" y2="130" stroke-dasharray="1,1"/>
    <line x1="100" y1="120" x2="100" y2="130" stroke-dasharray="1,1"/>
    <line x1="140" y1="120" x2="140" y2="130" stroke-dasharray="1,1"/>
  </g>
</svg>