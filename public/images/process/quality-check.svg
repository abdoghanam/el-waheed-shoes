<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradQ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#111"/>

  <!-- Inspector silhouette -->
  <g transform="translate(75,40)">
    <!-- Head -->
    <ellipse cx="25" cy="0" rx="14" ry="17" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
    <!-- Body -->
    <rect x="10" y="17" width="30" height="45" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8" rx="3"/>
    <!-- Arms -->
    <line x1="10" y1="25" x2="-5" y2="45" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="40" y1="25" x2="55" y2="40" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Apron -->
    <path d="M15,25 L35,25 L37,58 L13,58 Z" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Magnifying glass in left hand -->
  <g transform="translate(55,85)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#1a1a1a" opacity="0.3"/>
    <!-- Handle -->
    <line x1="12" y1="12" x2="30" y2="30" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    <!-- Lens glare -->
    <path d="M-8,-10 C-5,-14 0,-15 5,-12" fill="none" stroke="#F0D68A" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Shoe being inspected (inside magnifier view area) -->
  <g transform="translate(48,78)">
    <path d="M-5,5 C-5,0 0,-5 10,-8 C18,-10 25,-8 30,-3 L30,5 C25,2 18,0 10,0 C0,0 -5,3 -5,5 Z"
          fill="#1a1510" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Clipboard/checklist -->
  <g transform="translate(105,75)">
    <rect x="0" y="0" width="35" height="45" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1" rx="2"/>
    <!-- Clip -->
    <rect x="10" y="-5" width="15" height="8" fill="#1a1a1a" stroke="#D4AF37" stroke-width="0.8" rx="2"/>
    <!-- Checklist items -->
    <g stroke="#D4AF37" stroke-width="0.6" opacity="0.6">
      <!-- Check 1 -->
      <rect x="5" y="8" width="6" height="6" fill="none"/><path d="M6,11 L8,13 L10,9" fill="none"/>
      <line x1="14" y1="11" x2="28" y2="11"/>
      <!-- Check 2 -->
      <rect x="5" y="18" width="6" height="6" fill="none"/><path d="M6,21 L8,23 L10,19" fill="none"/>
      <line x1="14" y1="21" x2="28" y2="21"/>
      <!-- Check 3 -->
      <rect x="5" y="28" width="6" height="6" fill="none"/><path d="M6,31 L8,33 L10,29" fill="none"/>
      <line x1="14" y1="31" x2="28" y2="31"/>
      <!-- Line 4 (unchecked) -->
      <rect x="5" y="38" width="6" height="6" fill="none"/>
      <line x1="14" y1="41" x2="28" y2="41"/>
    </g>
  </g>

  <!-- Gold quality seal -->
  <g transform="translate(160,160)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="20" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>
    <!-- Star points -->
    <g fill="#D4AF37" opacity="0.7">
      <polygon points="0,-18 2,-8 -2,-8"/>
      <polygon points="0,18 2,8 -2,8"/>
      <polygon points="-18,0 -8,2 -8,-2"/>
      <polygon points="18,0 8,2 8,-2"/>
      <polygon points="-12,-12 -5,-6 -6,-5"/>
      <polygon points="12,-12 5,-6 6,-5"/>
      <polygon points="-12,12 -5,6 -6,5"/>
      <polygon points="12,12 5,6 6,5"/>
    </g>
    <!-- Checkmark in center -->
    <path d="M-8,0 L-3,5 L8,-5" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text around seal -->
    <text x="0" y="-10" text-anchor="middle" fill="#D4AF37" font-size="4" font-family="Arial" letter-spacing="1" opacity="0.6">QUALITY</text>
    <text x="0" y="14" text-anchor="middle" fill="#D4AF37" font-size="4" font-family="Arial" letter-spacing="1" opacity="0.6">PASS</text>
  </g>

  <!-- Sparkle indicators -->
  <g fill="#F0D68A" opacity="0.5">
    <circle cx="40" cy="60" r="1.5"/>
    <circle cx="155" cy="70" r="1"/>
  </g>
</svg>