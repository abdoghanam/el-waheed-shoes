<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="goldGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F0D68A"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="glowF"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#111"/>

  <!-- Sky atmosphere -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>

  <!-- Distant factory buildings silhouette -->
  <g fill="#0d0d0d" stroke="#1a1a1a" stroke-width="0.5">
    <rect x="50" y="180" width="60" height="120"/>
    <rect x="120" y="200" width="40" height="100"/>
    <rect x="650" y="190" width="50" height="110"/>
    <rect x="710" y="210" width="45" height="90"/>
  </g>

  <!-- Main factory building -->
  <g>
    <!-- Main structure -->
    <rect x="180" y="150" width="440" height="170" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1" opacity="0.8"/>

    <!-- Roof -->
    <polygon points="170,150 400,100 630,150" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.2"/>

    <!-- Smokestacks -->
    <rect x="220" y="70" width="25" height="80" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>
    <rect x="260" y="50" width="30" height="100" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>
    <rect x="540" y="80" width="22" height="70" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>

    <!-- Smoke wisps -->
    <path d="M232,70 C235,55 225,40 230,25 C235,10 245,5 240,0" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
    <path d="M275,50 C278,35 268,20 273,5 C278,-10 288,-15 283,-20" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.25"/>
    <path d="M551,80 C554,65 544,50 549,35" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.2"/>

    <!-- Factory windows - assembly line visible through -->
    <g stroke="#D4AF37" stroke-width="0.8">
      <!-- Large viewing windows -->
      <rect x="195" y="175" width="80" height="60" fill="#1a1a1a" opacity="0.9"/>
      <rect x="285" y="175" width="80" height="60" fill="#1a1a1a" opacity="0.9"/>
      <rect x="375" y="175" width="80" height="60" fill="#1a1a1a" opacity="0.9"/>
      <rect x="465" y="175" width="80" height="60" fill="#1a1a1a" opacity="0.9"/>
      <rect x="555" y="175" width="50" height="60" fill="#1a1a1a" opacity="0.9"/>
    </g>

    <!-- Window cross-bars -->
    <g stroke="#D4AF37" stroke-width="0.5" opacity="0.6">
      <line x1="235" y1="175" x2="235" y2="235"/><line x1="325" y1="175" x2="325" y2="235"/>
      <line x1="415" y1="175" x2="415" y2="235"/><line x1="505" y1="175" x2="505" y2="235"/>
      <line x1="580" y1="175" x2="580" y2="235"/>
    </g>

    <!-- Assembly line visible inside windows -->
    <g opacity="0.4" stroke="#D4AF37" stroke-width="0.5">
      <!-- Conveyor belt visible -->
      <line x1="200" y1="215" x2="600" y2="215"/>
      <!-- Small shoe shapes on belt -->
      <path d="M220,210 L230,210 L232,215 L218,215 Z" fill="#D4AF37" opacity="0.3"/>
      <path d="M310,210 L320,210 L322,215 L308,215 Z" fill="#D4AF37" opacity="0.3"/>
      <path d="M400,210 L410,210 L412,215 L398,215 Z" fill="#D4AF37" opacity="0.3"/>
      <path d="M490,210 L500,210 L502,215 L488,215 Z" fill="#D4AF37" opacity="0.3"/>
      <!-- Worker silhouettes inside -->
      <ellipse cx="260" cy="205" rx="6" ry="8" fill="#D4AF37" opacity="0.15"/>
      <ellipse cx="350" cy="205" rx="6" ry="8" fill="#D4AF37" opacity="0.15"/>
      <ellipse cx="440" cy="205" rx="6" ry="8" fill="#D4AF37" opacity="0.15"/>
      <ellipse cx="530" cy="205" rx="6" ry="8" fill="#D4AF37" opacity="0.15"/>
    </g>

    <!-- Door -->
    <rect x="360" y="260" width="80" height="60" fill="#0a0a0a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="430" cy="290" r="3" fill="#D4AF37" opacity="0.6"/>

    <!-- Loading dock -->
    <rect x="195" y="260" width="70" height="60" fill="#0a0a0a" stroke="#D4AF37" stroke-width="0.8"/>
    <rect x="540" y="260" width="70" height="60" fill="#0a0a0a" stroke="#D4AF37" stroke-width="0.8"/>

    <!-- Gold accent lighting strips -->
    <line x1="180" y1="152" x2="620" y2="152" stroke="#D4AF37" stroke-width="2" opacity="0.6" filter="url(#glowF)"/>
    <line x1="180" y1="318" x2="620" y2="318" stroke="#D4AF37" stroke-width="1.5" opacity="0.4" filter="url(#glowF)"/>
  </g>

  <!-- Ground / foreground -->
  <rect x="0" y="320" width="800" height="180" fill="#0a0a0a"/>

  <!-- Ground texture lines -->
  <g stroke="#D4AF37" stroke-width="0.3" opacity="0.1">
    <line x1="0" y1="340" x2="800" y2="340"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="380" x2="800" y2="380"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="420" x2="800" y2="420"/><line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="460" x2="800" y2="460"/><line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <!-- Delivery truck silhouette -->
  <g transform="translate(650,340)" fill="#0d0d0d" stroke="#D4AF37" stroke-width="0.8">
    <rect x="0" y="10" width="90" height="40" rx="3"/>
    <rect x="90" y="20" width="35" height="30" rx="2"/>
    <circle cx="20" cy="55" r="8" fill="#0a0a0a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="70" cy="55" r="8" fill="#0a0a0a" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="108" cy="55" r="8" fill="#0a0a0a" stroke="#D4AF37" stroke-width="1"/>
    <!-- Cargo boxes -->
    <rect x="8" y="15" width="20" height="15" fill="#D4AF37" opacity="0.15" stroke="#D4AF37" stroke-width="0.3"/>
    <rect x="32" y="18" width="18" height="12" fill="#D4AF37" opacity="0.15" stroke="#D4AF37" stroke-width="0.3"/>
    <rect x="55" y="15" width="22" height="15" fill="#D4AF37" opacity="0.15" stroke="#D4AF37" stroke-width="0.3"/>
  </g>

  <!-- Parking lot markings -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.1">
    <line x1="80" y1="400" x2="80" y2="440"/>
    <line x1="120" y1="400" x2="120" y2="440"/>
    <line x1="160" y1="400" x2="160" y2="440"/>
    <line x1="200" y1="400" x2="200" y2="440"/>
  </g>

  <!-- Puddle reflections -->
  <ellipse cx="400" cy="420" rx="120" ry="8" fill="#D4AF37" opacity="0.03"/>

  <!-- Ambient glow on ground from building -->
  <rect x="180" y="315" width="440" height="15" fill="#D4AF37" opacity="0.05"/>
</svg>